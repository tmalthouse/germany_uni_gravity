[project]
name = "unis"
version = "0.1.0"
description = "German university enrollment registers, 1800-1848: cleaning, geocoding, linkage and gravity analyses"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb==1.5.5",
    "kaleido>=1.0",
    "matplotlib==3.10.8",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "plotly==7.0.0",
    "polars==1.40.0",
    "pyarrow==24.0.0",
    "pyfixest==0.60.0",
    "scipy==1.17.1",
    "seaborn==0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
